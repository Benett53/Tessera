[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Window zones and remembered window positions for KDE Plasma"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.36.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
png = "0.17"
resvg = { version = "0.45", default-features = false }
ureq = "3"
minisign-verify = "0.3.0"
sha2 = "0.11.1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
